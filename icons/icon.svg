<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f2a31"/>
      <stop offset="1" stop-color="#05070b"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#37d3cf"/>
      <stop offset="1" stop-color="#f2b544"/>
    </linearGradient>
    <radialGradient id="core">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".35" stop-color="#9ff3ee"/>
      <stop offset="1" stop-color="#37d3cf" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ring)" stroke-width="30" filter="url(#glow)" opacity=".8"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ring)" stroke-width="22"/>
  <circle cx="256" cy="256" r="96" fill="url(#core)"/>
</svg>
